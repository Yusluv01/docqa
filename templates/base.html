<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DocQA{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { margin-bottom: 2rem; }
        .chat-container { height: 60vh; overflow-y: auto; padding: 1rem; background: white; border-radius: 8px; border: 1px solid #dee2e6; margin-bottom: 1rem;}
        .message { margin-bottom: 1rem; padding: 1rem; border-radius: 8px; max-width: 80%; }
        .user-message { background-color: #0d6efd; color: white; margin-left: auto; }
        .ai-message { background-color: #e9ecef; color: #212529; margin-right: auto; }
        .citation { font-size: 0.75rem; color: #6c757d; margin-top: 0.5rem; display: block;}
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'document_list' %}">📚 DocQA</a>
            <div class="d-flex">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">Hello, {{ user.username }}</span>
                    <form method="POST" action="{% url 'admin:logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
                {% else %}
                <a href="{% url 'admin:login' %}" class="btn btn-outline-light btn-sm">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
